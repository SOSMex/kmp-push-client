name: Stage Maven Central release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic tag on a commit reachable from main (for example v0.1.0)
        required: true
        type: string
      publish:
        description: Publish after Central validation instead of leaving the deployment staged for manual review
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-and-stage:
    name: Verify and stage signed artifacts
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Require dispatch from main
        shell: bash
        run: test "${GITHUB_REF}" = refs/heads/main

      - name: Check out tagged revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Apple Silicon runner and Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -n "${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag and main ancestry
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          release_tag_lower="$(printf '%s' "${RELEASE_TAG}" | tr '[:upper:]' '[:lower:]')"
          [[ "${release_tag_lower}" != *snapshot* ]]
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          release_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "${release_commit}"
          git merge-base --is-ancestor "${release_commit}" refs/remotes/origin/main
          release_version="${RELEASE_TAG#v}"
          printf 'version=%s\n' "${release_version}" >> "${GITHUB_OUTPUT}"
          printf 'commit=%s\n' "${release_commit}" >> "${GITHUB_OUTPUT}"

      - name: Run release verification matrix
        run: >-
          ./gradlew
          :push-core:jvmTest
          :push-fcm:jvmTest
          :push-onesignal:jvmTest
          :push-test:jvmTest
          :push-core:iosSimulatorArm64Test
          :push-fcm:iosSimulatorArm64Test
          :push-onesignal:iosSimulatorArm64Test
          :push-test:iosSimulatorArm64Test
          :push-fcm:compileAndroidMain
          :push-onesignal:compileAndroidMain
          :push-core:compileKotlinIosArm64
          :push-fcm:compileKotlinIosArm64
          :push-onesignal:compileKotlinIosArm64
          :push-test:compileKotlinIosArm64
          :sample:test
          :sample:run
          -PreleaseVersion=${{ steps.release.outputs.version }}
          --stacktrace

      - name: Build unsigned test Maven repository
        run: >-
          ./gradlew
          :push-core:publishAllPublicationsToTestRepository
          :push-fcm:publishAllPublicationsToTestRepository
          :push-onesignal:publishAllPublicationsToTestRepository
          :push-test:publishAllPublicationsToTestRepository
          -PreleaseVersion=${{ steps.release.outputs.version }}
          --stacktrace

      - name: Verify publication structure and metadata
        run: scripts/verify-maven-publications.sh build/test-maven "${{ steps.release.outputs.version }}"

      - name: Verify independent JVM Maven consumer
        run: >-
          ./gradlew
          -p integration-tests/maven-consumer
          run
          -PsdkVersion=${{ steps.release.outputs.version }}
          --stacktrace

      - name: Verify independent FCM Android and Apple Maven consumer
        run: >-
          ./gradlew
          -p integration-tests/kmp-maven-consumer
          clean
          compileAndroidMain
          linkDebugFrameworkIosSimulatorArm64
          linkDebugFrameworkIosArm64
          -PpushProvider=fcm
          -PsdkVersion=${{ steps.release.outputs.version }}
          --stacktrace

      - name: Verify independent OneSignal Android and Apple Maven consumer
        run: >-
          ./gradlew
          -p integration-tests/kmp-maven-consumer
          clean
          compileAndroidMain
          linkDebugFrameworkIosSimulatorArm64
          linkDebugFrameworkIosArm64
          -PpushProvider=onesignal
          -PsdkVersion=${{ steps.release.outputs.version }}
          --stacktrace

      - name: Stage or publish signed artifacts through Central Portal
        shell: bash
        env:
          REQUEST_PUBLICATION: ${{ inputs.publish }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          case "${REQUEST_PUBLICATION}" in
            true) deployment_validation=PUBLISHED ;;
            false) deployment_validation=VALIDATED ;;
            *) echo "publish input must be true or false" >&2; exit 2 ;;
          esac
          ./gradlew \
            :push-core:publishToMavenCentral \
            :push-fcm:publishToMavenCentral \
            :push-onesignal:publishToMavenCentral \
            :push-test:publishToMavenCentral \
            -PcentralRelease=true \
            -PcentralAutomaticRelease="${REQUEST_PUBLICATION}" \
            -PmavenCentralDeploymentValidation="${deployment_validation}" \
            -PreleaseVersion="${{ steps.release.outputs.version }}"

      - name: Record Central deployment summary
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REQUEST_PUBLICATION: ${{ inputs.publish }}
        run: |
          {
            echo '### Maven Central deployment'
            echo "- Version: ${RELEASE_VERSION}"
            echo "- Commit: ${RELEASE_COMMIT}"
            if [[ "${REQUEST_PUBLICATION}" == "true" ]]; then
              echo '- Requested outcome: publish after Central validation'
              echo '- Availability: verify separately from Maven Central before announcing the release'
            else
              echo '- Requested outcome: staged deployment for manual Portal review'
              echo '- Validation: inspect the Central Portal deployment before any manual publish action'
              echo '- Public release: not requested'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
