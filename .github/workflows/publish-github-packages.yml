name: Publish GitHub Packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-github-packages-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out released revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag and main ancestry
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([-.][0-9A-Za-z.-]+)?$ ]]
          release_version="${RELEASE_TAG#v}"
          release_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          git merge-base --is-ancestor "${release_commit}" origin/main
          printf 'version=%s\n' "${release_version}" >> "${GITHUB_OUTPUT}"
          printf 'commit=%s\n' "${release_commit}" >> "${GITHUB_OUTPUT}"

      - name: Run release verification matrix
        run: >-
          ./gradlew
          :push-core:jvmTest
          :push-fcm:jvmTest
          :push-onesignal:jvmTest
          :push-test:jvmTest
          :push-core:iosSimulatorArm64Test
          :push-fcm:iosSimulatorArm64Test
          :push-onesignal:iosSimulatorArm64Test
          :push-test:iosSimulatorArm64Test
          :push-fcm:compileAndroidMain
          :push-onesignal:compileAndroidMain
          :push-core:compileKotlinIosArm64
          :push-fcm:compileKotlinIosArm64
          :push-onesignal:compileKotlinIosArm64
          :push-test:compileKotlinIosArm64
          :sample:run
          -PreleaseVersion=${{ steps.version.outputs.version }}
          --stacktrace

      - name: Publish exact release to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew
          :push-core:publishAllPublicationsToGithubPackagesRepository
          :push-fcm:publishAllPublicationsToGithubPackagesRepository
          :push-onesignal:publishAllPublicationsToGithubPackagesRepository
          :push-test:publishAllPublicationsToGithubPackagesRepository
          -PreleaseVersion=${{ steps.version.outputs.version }}
          --stacktrace

      - name: Record publication summary
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo '### GitHub Packages publication'
            echo "- Version: ${RELEASE_VERSION}"
            echo "- Commit: ${RELEASE_COMMIT}"
            echo '- Registry: GitHub Packages'
            echo '- Maven Central publication: not performed'
          } >> "${GITHUB_STEP_SUMMARY}"
